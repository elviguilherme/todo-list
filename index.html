<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

  <div class="container">
    <h1>
      <svg class="icone-titulo" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <line x1="7" y1="8" x2="17" y2="8"></line>
        <line x1="7" y1="12" x2="17" y2="12"></line>
        <line x1="7" y1="16" x2="13" y2="16"></line>
      </svg>
      Minha Lista de Tarefas
    </h1>

    <div class="formulario">

      <div class="campos-tarefa">
        <input type="text" id="inputDescricao" placeholder="Descreva a tarefa...">

        <select id="selectPrioridade">
          <option value="">Prioridade</option>
          <option value="Baixa">Baixa</option>
          <option value="Média">Média</option>
          <option value="Alta">Alta</option>
        </select>
      </div>

      <button id="btnAdicionar" title="Adicionar tarefa">+</button>
    </div>

    <div id="areaErro"></div>

    <ul id="listaTarefas"></ul>
  </div>

  <div id="modalOverlay" class="modal-overlay escondido">
    <div class="modal-caixa">
      <div class="modal-icone">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <h2>Excluir tarefa?</h2>
      <p id="modalMensagem">Essa tarefa ainda não foi concluída. Deseja excluir mesmo assim?</p>
      <div class="modal-botoes">
        <button id="modalCancelar" class="modal-btn cancelar">Cancelar</button>
        <button id="modalConfirmar" class="modal-btn confirmar">Excluir</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
